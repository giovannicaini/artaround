<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ArtAround Marketplace - Crea e gestisci i tuoi contenuti museali"
    />
    <title>ArtAround Marketplace</title>
    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts async with display=swap to prevent blocking -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Font selezionabili per il branding Navigator (vedi NAVIGATOR_FONT_OPTIONS
         in packages/shared) — solo per l'anteprima nel select dell'editor
         config, pesi minimi, caricati senza bloccare il primo render. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Plus+Jakarta+Sans:wght@400;600&family=Playfair+Display:wght@400;600&family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;600&family=Poppins:wght@400;600&family=Space+Grotesk:wght@400;600&family=Merriweather:wght@400;700&family=Work+Sans:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <div id="app">
      <app-root></app-root>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
