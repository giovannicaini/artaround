<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7d8"/>
      <stop offset="1" stop-color="#e6dcc6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#faf6ee"/>
  <text x="60" y="35" font-size="18" font-weight="700" fill="#5c4a2a">Galleria Borghese &#8212; Piano Terra</text>
  <text x="60" y="56" font-size="11.5" fill="#8a7550">Casino nobile di Villa Borghese &#8212; numerazione storica delle sale</text>

  <!-- Muro perimetrale -->
  <rect x="60" y="100" width="880" height="440" rx="4" fill="url(#wallGrad)" stroke="#8c7a5e" stroke-width="4"/>

  <!-- Cappella: bozzo semicircolare sul confine IV/III -->
  <path d="M 665 100 A 55 55 0 0 1 775 100 Z" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
  <text x="720" y="80" text-anchor="middle" font-size="11" fill="#8a7550">Cappella</text>

  <!-- RIGA 1: VI - V - IV - III -->
  <g>
    <rect x="60" y="100" width="220" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
    <circle cx="86" cy="126" r="14" fill="#c98a52"/>
    <text x="86" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">VI</text>
    <text x="170" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#5c4a2a">Stanza del</text>
    <text x="170" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#5c4a2a">Gladiatore</text>
  </g>
  <g>
    <rect x="280" y="100" width="220" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
    <circle cx="306" cy="126" r="14" fill="#c98a52"/>
    <text x="306" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">V</text>
    <text x="390" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#5c4a2a">Sala dell'</text>
    <text x="390" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#5c4a2a">Ermafrodito</text>
  </g>
  <g>
    <rect x="500" y="100" width="220" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
    <circle cx="526" cy="126" r="14" fill="#c98a52"/>
    <text x="526" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">IV</text>
    <text x="610" y="187" text-anchor="middle" font-size="14" font-weight="600" fill="#5c4a2a">Galleria</text>
  </g>
  <g>
    <rect x="720" y="100" width="220" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
    <circle cx="746" cy="126" r="14" fill="#c98a52"/>
    <text x="746" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">III</text>
    <text x="830" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#5c4a2a">Sala del Bernini</text>
    <text x="830" y="196" text-anchor="middle" font-size="12" fill="#8a7550">Apollo e Dafne</text>
  </g>

  <!-- RIGA 2-3 sinistra: VII / VIII -->
  <g>
    <rect x="60" y="247" width="270" height="146" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
    <circle cx="86" cy="273" r="14" fill="#c98a52"/>
    <text x="86" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">VII</text>
    <text x="195" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#5c4a2a">Sala Egizia</text>
  </g>
  <g>
    <rect x="60" y="393" width="270" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
    <circle cx="86" cy="419" r="14" fill="#c98a52"/>
    <text x="86" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">VIII</text>
    <text x="195" y="465" text-anchor="middle" font-size="14" font-weight="600" fill="#5c4a2a">Sala di Bacco</text>
    <text x="195" y="483" text-anchor="middle" font-size="12" fill="#8a7550">(Caravaggio)</text>
  </g>

  <!-- Centro: SALONE + PORTICO -->
  <g>
    <rect x="330" y="247" width="340" height="223" fill="#f1e4bd" stroke="#a8894f" stroke-width="3"/>
    <text x="500" y="355" text-anchor="middle" font-size="21" font-weight="600" fill="#5c4a2a">Salone</text>
    <text x="500" y="377" text-anchor="middle" font-size="12" fill="#8a7550">d'ingresso &#8226; S</text>
  </g>
  <g>
    <rect x="330" y="470" width="340" height="70" fill="#faf6ee" stroke="#a8894f" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="500" y="512" text-anchor="middle" font-size="13" fill="#8a7550">Portico &#8226; P</text>
  </g>
  <!-- scalinata d'ingresso -->
  <line x1="380" y1="548" x2="620" y2="548" stroke="#a8894f" stroke-width="2"/>
  <line x1="390" y1="560" x2="610" y2="560" stroke="#a8894f" stroke-width="2"/>
  <line x1="400" y1="572" x2="600" y2="572" stroke="#a8894f" stroke-width="2"/>
  <polygon points="500,595 486,576 514,576" fill="#a8894f"/>
  <text x="500" y="613" text-anchor="middle" font-size="11" fill="#8a7550">Ingresso principale</text>

  <!-- RIGA 2-3 destra: II / I -->
  <g>
    <rect x="670" y="247" width="270" height="146" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
    <circle cx="914" cy="273" r="14" fill="#c98a52"/>
    <text x="914" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">II</text>
    <text x="805" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#5c4a2a">Seconda sala</text>
  </g>
  <g>
    <rect x="670" y="393" width="270" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
    <circle cx="914" cy="419" r="14" fill="#c98a52"/>
    <text x="914" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">I</text>
    <text x="805" y="470" text-anchor="middle" font-size="15" font-weight="600" fill="#5c4a2a">Prima sala</text>
  </g>

  <!-- porte interne (varchi tra sale): ogni apertura reale tra sale adiacenti,
       stanza-stanza o stanza-Salone/Portico, come nella pianta storica -->
  <rect x="278" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- VI-V -->
  <rect x="498" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- V-IV -->
  <rect x="718" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- IV-III -->
  <rect x="145.0" y="245" width="50" height="4" fill="#faf6ee"/> <!-- VI-VII -->
  <rect x="170.0" y="391" width="50" height="4" fill="#faf6ee"/> <!-- VII-VIII -->
  <rect x="328" y="295.0" width="4" height="50" fill="#faf6ee"/> <!-- VII-Salone -->
  <rect x="328" y="405.0" width="4" height="50" fill="#faf6ee"/> <!-- VIII-Salone -->
  <rect x="805.0" y="245" width="50" height="4" fill="#faf6ee"/> <!-- III-II -->
  <rect x="780.0" y="391" width="50" height="4" fill="#faf6ee"/> <!-- II-I -->
  <rect x="668" y="295.0" width="4" height="50" fill="#faf6ee"/> <!-- Salone-II -->
  <rect x="668" y="405.0" width="4" height="50" fill="#faf6ee"/> <!-- Salone-I -->
  <rect x="460.0" y="468" width="80" height="4" fill="#faf6ee"/> <!-- Salone-Portico -->
  <rect x="385.0" y="245" width="50" height="4" fill="#faf6ee"/> <!-- V-Salone -->
  <rect x="565.0" y="245" width="50" height="4" fill="#faf6ee"/> <!-- IV-Salone -->

  <!-- Scala al primo piano -->
  <g>
    <rect x="880" y="450" width="50" height="80" fill="#e9ded0" stroke="#8c7a5e" stroke-width="2"/>
    <line x1="880" y1="462" x2="930" y2="462" stroke="#8c7a5e" stroke-width="1.2"/>
    <line x1="880" y1="474" x2="930" y2="474" stroke="#8c7a5e" stroke-width="1.2"/>
    <line x1="880" y1="486" x2="930" y2="486" stroke="#8c7a5e" stroke-width="1.2"/>
    <line x1="880" y1="498" x2="930" y2="498" stroke="#8c7a5e" stroke-width="1.2"/>
    <line x1="880" y1="510" x2="930" y2="510" stroke="#8c7a5e" stroke-width="1.2"/>
    <line x1="880" y1="522" x2="930" y2="522" stroke="#8c7a5e" stroke-width="1.2"/>
    <text x="905" y="443" text-anchor="middle" font-size="10" fill="#5c4a2a">Al 1&#176; piano</text>
  </g>
</svg>
