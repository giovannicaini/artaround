<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7d8"/>
      <stop offset="1" stop-color="#e6dcc6"/>
    </linearGradient>
  </defs>

  <!-- Sfondo -->
  <rect x="0" y="0" width="1000" height="700" fill="#faf6ee"/>

  <!-- Muro perimetrale -->
  <rect x="60" y="100" width="880" height="440" rx="4" fill="url(#wallGrad)" stroke="#8c7a5e" stroke-width="4"/>

  <!-- Cappella: bozzo semicircolare sul confine IV/III -->
  <path d="M 665 100 A 55 55 0 0 1 775 100 Z" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>

  <!-- RIGA 1: VI - V - IV - III -->
  <rect x="60" y="100" width="220" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
  <rect x="280" y="100" width="220" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
  <rect x="500" y="100" width="220" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
  <rect x="720" y="100" width="220" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>

  <!-- RIGA 2-3 sinistra: VII / VIII -->
  <rect x="60" y="247" width="270" height="146" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
  <rect x="60" y="393" width="270" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>

  <!-- Centro: SALONE + PORTICO -->
  <rect x="330" y="247" width="340" height="223" fill="#f1e4bd" stroke="#a8894f" stroke-width="3"/>
  <rect x="330" y="470" width="340" height="70" fill="#faf6ee" stroke="#a8894f" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- scalinata d'ingresso -->
  <line x1="380" y1="548" x2="620" y2="548" stroke="#a8894f" stroke-width="2"/>
  <line x1="390" y1="560" x2="610" y2="560" stroke="#a8894f" stroke-width="2"/>
  <line x1="400" y1="572" x2="600" y2="572" stroke="#a8894f" stroke-width="2"/>
  <polygon points="500,595 486,576 514,576" fill="#a8894f"/>

  <!-- RIGA 2-3 destra: II / I -->
  <rect x="670" y="247" width="270" height="146" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>
  <rect x="670" y="393" width="270" height="147" fill="#fdfaf3" stroke="#b5896a" stroke-width="2.5"/>

  <!-- porte interne (varchi tra sale): ogni apertura reale tra sale adiacenti,
       stanza-stanza o stanza-Salone/Portico, come nella pianta storica -->
  <rect x="278" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- VI-V -->
  <rect x="498" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- V-IV -->
  <rect x="718" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- IV-III -->
  <rect x="145.0" y="245" width="50" height="4" fill="#faf6ee"/> <!-- VI-VII -->
  <rect x="170.0" y="391" width="50" height="4" fill="#faf6ee"/> <!-- VII-VIII -->
  <rect x="328" y="295.0" width="4" height="50" fill="#faf6ee"/> <!-- VII-Salone -->
  <rect x="328" y="405.0" width="4" height="50" fill="#faf6ee"/> <!-- VIII-Salone -->
  <rect x="805.0" y="245" width="50" height="4" fill="#faf6ee"/> <!-- III-II -->
  <rect x="780.0" y="391" width="50" height="4" fill="#faf6ee"/> <!-- II-I -->
  <rect x="668" y="295.0" width="4" height="50" fill="#faf6ee"/> <!-- Salone-II -->
  <rect x="668" y="405.0" width="4" height="50" fill="#faf6ee"/> <!-- Salone-I -->
  <rect x="460.0" y="468" width="80" height="4" fill="#faf6ee"/> <!-- Salone-Portico -->
  <rect x="385.0" y="245" width="50" height="4" fill="#faf6ee"/> <!-- V-Salone -->
  <rect x="565.0" y="245" width="50" height="4" fill="#faf6ee"/> <!-- IV-Salone -->

  <!-- Vano scale/ascensore verso il primo piano (etichette dai marker) -->
  <rect x="880" y="450" width="50" height="80" fill="#e9ded0" stroke="#8c7a5e" stroke-width="2"/>
  <line x1="880" y1="462" x2="930" y2="462" stroke="#8c7a5e" stroke-width="1.2"/>
  <line x1="880" y1="474" x2="930" y2="474" stroke="#8c7a5e" stroke-width="1.2"/>
  <line x1="880" y1="486" x2="930" y2="486" stroke="#8c7a5e" stroke-width="1.2"/>
  <line x1="880" y1="498" x2="930" y2="498" stroke="#8c7a5e" stroke-width="1.2"/>
  <line x1="880" y1="510" x2="930" y2="510" stroke="#8c7a5e" stroke-width="1.2"/>
  <line x1="880" y1="522" x2="930" y2="522" stroke="#8c7a5e" stroke-width="1.2"/>
</svg>
