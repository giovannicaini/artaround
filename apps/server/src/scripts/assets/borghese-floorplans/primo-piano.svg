<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <linearGradient id="wallGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe0dc"/>
      <stop offset="1" stop-color="#e6d0ca"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#faf6ee"/>
  <text x="60" y="35" font-size="18" font-weight="700" fill="#5c3d34">Galleria Borghese &#8212; Primo Piano</text>
  <text x="60" y="56" font-size="11.5" fill="#7a5a52">Casino nobile di Villa Borghese &#8212; numerazione storica delle sale</text>

  <!-- Muro perimetrale -->
  <rect x="60" y="100" width="880" height="440" rx="4" fill="url(#wallGrad2)" stroke="#8c6a63" stroke-width="4"/>

  <!-- Vano centrale -->
  <g>
    <rect x="280" y="247" width="500" height="213" fill="#faf6ee" stroke="#8c6a63" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="530" y="345" text-anchor="middle" font-size="13" fill="#7a5a52">Vano centrale</text>
    <text x="530" y="362" text-anchor="middle" font-size="11" fill="#9a8074">(sopra il Salone del piano terra)</text>
    <g transform="translate(650,395)">
      <rect x="0" y="0" width="80" height="55" fill="#e9d6cf" stroke="#8c6a63" stroke-width="1.2"/>
      <line x1="0" y1="10" x2="80" y2="10" stroke="#8c6a63" stroke-width="1"/>
      <line x1="0" y1="20" x2="80" y2="20" stroke="#8c6a63" stroke-width="1"/>
      <line x1="0" y1="30" x2="80" y2="30" stroke="#8c6a63" stroke-width="1"/>
      <line x1="0" y1="40" x2="80" y2="40" stroke="#8c6a63" stroke-width="1"/>
      <line x1="0" y1="50" x2="80" y2="50" stroke="#8c6a63" stroke-width="1"/>
      <text x="40" y="-6" text-anchor="middle" font-size="10" fill="#7a5a52">Dal piano terra</text>
    </g>
  </g>

  <!-- RIGA 1: XVII - XVIII - XV - XIV - XIII - XII -->
  <g>
    <rect x="60" y="100" width="110" height="147" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="82" cy="122" r="13" fill="#a06a5e"/>
    <text x="82" y="126" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">XVII</text>
    <text x="115" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#5c3d34">Sala XVII</text>
  </g>
  <g>
    <rect x="170" y="100" width="110" height="147" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="192" cy="122" r="13" fill="#a06a5e"/>
    <text x="192" y="126" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">XVIII</text>
    <text x="225" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#5c3d34">Camera di</text>
    <text x="225" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#5c3d34">Gagneraux</text>
  </g>
  <g>
    <rect x="280" y="100" width="220" height="147" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="306" cy="126" r="14" fill="#a06a5e"/>
    <text x="306" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">XV</text>
    <text x="390" y="185" text-anchor="middle" font-size="14" font-weight="600" fill="#5c3d34">Camera dei</text>
    <text x="390" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#5c3d34">ritratti</text>
  </g>
  <g>
    <rect x="500" y="100" width="280" height="147" fill="#f3e6c9" stroke="#a8894f" stroke-width="3"/>
    <circle cx="526" cy="126" r="14" fill="#c9a15a"/>
    <text x="526" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">XIV</text>
    <text x="640" y="185" text-anchor="middle" font-size="16" font-weight="600" fill="#5c4a2a">Salone del</text>
    <text x="640" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#5c4a2a">Lanfranco</text>
  </g>
  <g>
    <rect x="780" y="100" width="80" height="147" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="802" cy="122" r="13" fill="#a06a5e"/>
    <text x="802" y="126" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">XIII</text>
    <text x="820" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#5c3d34">Sala XIII</text>
  </g>
  <g>
    <rect x="860" y="100" width="80" height="147" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="882" cy="122" r="13" fill="#a06a5e"/>
    <text x="882" y="126" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">XII</text>
    <text x="900" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#5c3d34">Sala XII</text>
  </g>

  <!-- Colonna sinistra: XVI / XIX -->
  <g>
    <rect x="60" y="247" width="220" height="106" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="86" cy="270" r="13" fill="#a06a5e"/>
    <text x="86" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">XVI</text>
    <text x="180" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d34">Seconda camera</text>
  </g>
  <g>
    <rect x="60" y="353" width="220" height="107" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="86" cy="376" r="13" fill="#a06a5e"/>
    <text x="86" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">XIX</text>
    <text x="180" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d34">Sala di Elena</text>
    <text x="180" y="416" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d34">e Paride</text>
  </g>

  <!-- Colonna destra: XI / X -->
  <g>
    <rect x="780" y="247" width="160" height="106" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="806" cy="270" r="13" fill="#a06a5e"/>
    <text x="806" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">XI</text>
    <text x="870" y="304" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d34">Ottava camera</text>
  </g>
  <g>
    <rect x="780" y="353" width="160" height="107" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="806" cy="376" r="13" fill="#a06a5e"/>
    <text x="806" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">X</text>
    <text x="870" y="410" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d34">Settima camera</text>
  </g>

  <!-- RIGA 4: XX ... IX -->
  <g>
    <rect x="60" y="460" width="220" height="80" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="86" cy="483" r="13" fill="#a06a5e"/>
    <text x="86" y="487" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">XX</text>
    <text x="180" y="495" text-anchor="middle" font-size="12" font-weight="600" fill="#5c3d34">Sala dell'Orizzonte</text>
    <text x="180" y="511" text-anchor="middle" font-size="11" fill="#8a7550">Van Bloemen</text>
  </g>
  <g>
    <rect x="780" y="460" width="160" height="80" fill="#fdfaf3" stroke="#b58a80" stroke-width="2.5"/>
    <circle cx="806" cy="483" r="13" fill="#a06a5e"/>
    <text x="806" y="487" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">IX</text>
    <text x="870" y="502" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d34">Sesta camera</text>
  </g>

  <!-- porte interne (varchi tra sale): il vano centrale è già "aperto" (muro
       tratteggiato = nessuna parete reale), quindi qui servono solo le aperture
       sui muri pieni tra sale adiacenti -->
  <rect x="168" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- XVII-XVIII -->
  <rect x="278" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- XVIII-XV -->
  <rect x="498" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- XV-XIV -->
  <rect x="778" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- XIV-XIII -->
  <rect x="858" y="148.0" width="4" height="50" fill="#faf6ee"/> <!-- XIII-XII -->
  <rect x="92.5" y="245" width="45" height="4" fill="#faf6ee"/> <!-- XVI-XVII -->
  <rect x="202.5" y="245" width="45" height="4" fill="#faf6ee"/> <!-- XVI-XVIII -->
  <rect x="145.0" y="351" width="50" height="4" fill="#faf6ee"/> <!-- XVI-XIX -->
  <rect x="145.0" y="458" width="50" height="4" fill="#faf6ee"/> <!-- XIX-XX -->
  <rect x="877.5" y="245" width="45" height="4" fill="#faf6ee"/> <!-- XII-XI -->
  <rect x="797.5" y="245" width="45" height="4" fill="#faf6ee"/> <!-- XIII-XI -->
  <rect x="835.0" y="351" width="50" height="4" fill="#faf6ee"/> <!-- XI-X -->
  <rect x="835.0" y="458" width="50" height="4" fill="#faf6ee"/> <!-- X-IX -->
</svg>
